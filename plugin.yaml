name: alchemy-task
version: "0.1.0"
description: "Turns messy operator work into tracked, researched, finished tasks: Markdown tasks with stable IDs, Git delivery, background research and work-session checkpoints."
author: "Daren Broxmeyer"
license: MIT
requires_hermes: ">=0.22.5"
provides_tools:
  - task_create
  - task_update
  - task_find
  - task_research
  - task_research_sweep
  - task_work_start
  - task_checkpoint
  - task_setup
  - task_ios
  - discovery_stream
  - discovery_start
  - discovery_submit
  - discovery_decide
  - discovery_config
  - discovery_collect
  - discovery_context
  - discovery_research_run
  - discovery_research_fetch
  - discovery_research_submit
  - discovery_research_accept
  - discovery_actions
  - discovery_reconcile
  - discovery_join
  - discovery_recover
  - discovery_release_hold
  - discovery_match
  - discovery_decision
  - discovery_conversion_recover
  - discovery_digest
  - discovery_runs
  - discovery_link_audit
  - discovery_replay
  - research_skills_list
  - research_skill_view
  - research_capabilities
  - research_submit
  - research_git_find_repos
  - research_git_log
  - research_git_show
  - research_git_grep
  - research_git_ls_files
provides_hooks:
  - pre_tool_call
  - subagent_start
  - subagent_stop
  - pre_llm_call
  - post_llm_call
  - on_session_finalize
  - post_compaction
  - post_tool_call
config_schema:
  workspace_root:
    type: str
    default: ""
    label: "Task workspace"
    description: "Absolute path of the folder (a Git repository) that holds your tasks. Set during setup."
  task_dir:
    type: str
    default: "areas/{area}/tasks"
    label: "Task folder pattern"
    description: "Where each area's task files live, relative to the workspace."
  areas:
    type: list
    default: []
    description: "Area names (for example work, home). Empty means use the existing area folders."
  default_area:
    type: str
    default: ""
    description: "Area to use when none is given and it cannot be inferred."
  timezone:
    type: str
    default: ""
    description: "IANA timezone for dates (for example America/New_York). Empty uses Hermes's timezone."
  research_by_default:
    type: bool
    default: true
    description: "Research every new task automatically unless the user says no research is needed."
  git_transport:
    type: str
    choices: [system, none]
    default: system
    label: "Git push method"
    description: "system: push with this machine's own Git setup. none: local commits only."
  git_remote:
    type: str
    default: "origin"
  git_branch:
    type: str
    default: ""
    description: "Branch to push. Empty uses the current branch."
  git_run_hooks:
    type: bool
    default: true
    description: "Run the repository's Git hooks when committing."
  git_allow_repo_programs:
    type: bool
    default: false
    description: "Allow pushing when the repository's own Git config names transport programs (off is safer)."
